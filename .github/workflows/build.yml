name: Build WiiDoom

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitppc:latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Wii toolchain libraries
        run: |
          dkp-pacman -Sy --noconfirm --needed wii-dev ppc-portlibs wii-portlibs

      - name: Build boot.dol
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITPPC=/opt/devkitpro/devkitPPC
          make

      - name: Upload boot.dol
        uses: actions/upload-artifact@v4
        with:
          name: WiiDoom-boot-dol
          path: dist/apps/WiiDoom/boot.dol
